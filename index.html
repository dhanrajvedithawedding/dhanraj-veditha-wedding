let index=0,busy=false;const card=document.getElementById('card'),content=document.getElementById('content'),dots=document.getElementById('dots');function render(){const p=pages[index];content.innerHTML='<div class="pre">'+p.pre+'</div><div class="flourish">'+p.icon+'</div><h1 class="heading '+(p.second?'names':'')+'">'+p.title+(p.second?'<span class="amp">&amp;</span>'+p.second:'')+'</h1><div class="divider">✧</div><div class="date">'+p.date+'</div><div class="details">'+p.details+'</div><p class="message">'+p.message+'</p><div class="elephants" aria-hidden="true"><span>🐘</span><span>❦</span><span>🐘</span></div>';document.getElementById('counter').textContent=String(index+1).padStart(2,'0')+' / 05';dots.innerHTML=pages.map((_,i)=>'<button class="dot '+(i===index?'active':'')+'" data-i="'+i+'" aria-label="Go to invitation '+(i+1)+'"></button>').join('');dots.querySelectorAll('button').forEach(b=>b.onclick=()=>go(Number(b.dataset.i)))}function go(n){if(busy)return;busy=true;card.classList.remove('in');card.classList.add('out');setTimeout(()=>{index=(n+pages.length)%pages.length;render();card.classList.remove('out');void card.offsetWidth;card.classList.add('in');busy=false},520)}document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});let touchX=0;document.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-touchX;if(Math.abs(d)>60)go(index+(d<0?1:-1))},{passive:true});const stars=document.getElementById('stars');for(let i=0;i<85;i++){let s=document.createElement('span');s.className='star';s.textContent=i%5===0?'✦':i%3===0?'✧':'✶';s.style.left=Math.random()*100+'%';s.style.fontSize=(7+Math.random()*15)+'px';s.style.animationDuration=(7+Math.random()*13)+'s';s.style.animationDelay=(-Math.random()*20 let audio,playing=false,interval,voices=[];const sound=document.getElementById('sound');sound.onclick=async()=>{if(playing){clearInterval(interval);await audio.suspend();playing=false;sound.textContent='♫';return}audio=audio||new(window.AudioContext||window.webkitAudioContext)();await audio.resume();let n=0;function note(freq,when,dur,vol){let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(vol,when+.12);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g).connect(audio.destination);o.start(when);o.stop(when+dur+.02)}function phrase(){let f=[261.63,329.63,392,523.25,493.88,392,329.63,293.66][n++%8];note(f,audio.currentTime,2.5,.035);note(f/2,audio.currentTime,3,.014)}phrase();interval=setInterval(phrase,1500);playing=true;sound.textContent='Ⅱ'};</script></body></html>
