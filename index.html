    const n=[];if(x>0)n.push(j-1);if(x<w-1)n.push(j+1);if(j>=w)n.push(j-w);if(j<(h-1)*w)n.push(j+w);
    for(const t of n){if(seen[t])touch=true;else if(!visited[t]&&bg(t)){visited[t]=1;q.push(t)}}
   }
   // Interior openings between two figures are sizeable; tiny garment
   // highlights remain untouched.
   if(comp.length>=24&&(touch||comp.length>=120))for(const j of comp)seen[j]=1;
  }
  // Remove leftover bright background in the central opening between
  // the two figures, including near-white pixels disconnected by compression.
  // Keep pale fabric details outside that narrow gap.
  const gapMask=new Uint8Array(w*h),gapQueue=[];
  function gapBackground(i){

   return r>174&&g>174&&b>171&&Math.max(r,g,b)-Math.min(r,g,b)<55;
  }
  function gapSeed(i){if(!gapMask[i]&&gapBackground(i)){gapMask[i]=1;gapQueue.push(i)}}
  for(let y=Math.floor(h*.28);y<Math.floor(h*.89);y++){
   for(let x=Math.floor(w*.37);x<Math.floor(w*.71);x++){
    const i=y*w+x;
    if(seen[i]&&gapBackground(i))gapSeed(i);
   }
  }

   const i=gapQueue.pop(),x=i%w,y=Math.floor(i/w);
   if(x>Math.floor(w*.35))gapSeed(i-1);
   if(x<Math.floor(w*.73))gapSeed(i+1);
   if(y>Math.floor(h*.25))gapSeed(i-w);
   if(y<Math.floor(h*.91))gapSeed(i+w);
  }
  for(let i=0;i<w*h;i++)if(gapMask[i])seen[i]=1;
  for(let i=0;i<w*h;i++)if(seen[i])p[i*4+3]=0;
  // Decontaminate white antialias fringe for a clean gold-edged silhouette.
  for(let i=0;i<w*h;i++){
   if(seen[i])continue;const x=i%w,y=Math.floor(i/w),n=[];
   if(x>0)n.push(i-1);if(x<w-1)n.push(i+1);if(y>0)n.push(i-w);if(y<h-1)n.push(i+w);
   if(n.some(j=>seen[j])){
    const k=i*4,r=p[k],g=p[k+1],b=p[k+2],v=Math.min(r,g,b);
    if(v>160&&Math.max(r,g,b)-v<60)p[k+3]=Math.round(p[k+3]*Math.max(.06,(238-v)/90));
   }
  }
  const edges=[];
  for(let y=2;y<h-2;y+=3)for(let x=2;x<w-2;x+=3){
   const i=y*w+x;if(p[i*4+3]<180)continue;
   if(seen[i-1]||seen[i+1]||seen[i-w]||seen[i+w]||seen[i-2]||seen[i+2])edges.push([x/w,y/h]);
  }
  edgePoints=edges.length?Array.from({length:32},(_,i)=>edges[Math.floor((i+.3)*edges.length/32)]):[];
  ctx.putImageData(d,0,0);resolve(c.toDataURL('image/png'));
 }catch(e){resolve(src)}
 };
 im.onerror=()=>resolve(src);im.src=src;
});
}
function sparkle(el){
 const wrap=el.parentElement;if(!wrap||wrap.querySelector('.couple-edge-sparkles'))return;
 const layer=document.createElement('div');layer.className='couple-edge-sparkles';layer.setAttribute('aria-hidden','true');
 for(let i=0;i<edgePoints.length;i++){
  const s=document.createElement('i');s.className='couple-gold-flake';s.textContent=i%3===0?'✦':'✧';
  s.style.left=(edgePoints[i][0]*100)+'%';s.style.top=(edgePoints[i][1]*100)+'%';
  s.style.setProperty('--d',(i%11)*.27+'s');layer.appendChild(s);
 }
 wrap.appendChild(layer);
}
async function apply(){

}
const root=document.getElementById('card');
if(root){new MutationObserver(apply).observe(root,{childList:true});apply()}
})();
