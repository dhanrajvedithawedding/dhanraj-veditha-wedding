*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#250510;color:#68241c}body{font-family:"Cormorant Garamond",Georgia,serif}.screen{position:fixed;inset:0;display:grid;place-items:center;background:#21040c}.stage{width:min(100vw,177.77778vh);height:min(100vh,56.25vw);aspect-ratio:16/9;position:relative;overflow:hidden;background:#40111a;box-shadow:0 0 120px #000}.backdrop{position:absolute;inset:-1.8%;background:radial-gradient(ellipse at center,#b98267,#522034 75%,#200713);background-image:url("palace-artwork.webp");background-position:center;background-size:100% 100%;background-repeat:no-repeat;animation:camera 23s ease-in-out infinite alternate;filter:saturate(1.06)}@keyframes camera{from{transform:scale(1.018)}to{transform:scale(1.07)}}.backdrop:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,#2c071527 100%)}.cover{position:absolute;left:26.5%;top:31.3%;width:47%;height:52%;border-radius:12px;background:radial-gradient(ellipse at 50% 15%,#ffe7b9 0%,#f5d4a0 55%,#edbf85 100%);box-shadow:0 0 0 3px #f8d492,0 0 0 6px #d28d3e,0 0 22px #eab468, inset 0 0 24px #b5794559;z-index:2}.cover:before{content:"";position:absolute;inset:1.6%;border:1px solid #d6a15a;border-radius:9px;pointer-events:none}.card{position:absolute;left:27.3%;top:31.8%;width:45.4%;height:50.9%;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5% 1.4%;transform-style:preserve-3d}.card.enter{animation:comeForward 1.35s cubic-bezier(.12,.82,.24,1) both}.card.exit{animation:goBackward .8s ease-in both}@keyframes comeForward{from{opacity:0;transform:perspective(1000px) translateZ(-420px) scale(.68) rotateX(9deg);filter:blur(13px)}to{opacity:1;transform:perspective(1000px) translateZ(0) scale(1);filter:blur(0)}}@keyframes goBackward{from{opacity:1;transform:perspective(1000px) translateZ(0) scale(1)}to{opacity:0;transform:perspective(1000px) translateZ(-430px) scale(.66) rotateX(-7deg);filter:blur(10px)}}.eyebrow{font:600 clamp(11px,1.8vw,32px) Cinzel,serif;letter-spacing:.18em;color:#71251d;margin:0 0 .4%}.names{font:400 clamp(20px,4.4vw,79px) "Great Vibes",cursive;color:#a66622;text-shadow:0 1px #fff5d6,0 2px 3px #a16c4277;line-height:1.15;margin:0}.divider{font-size:clamp(10px,1.7vw,25px);color:#b07b36;line-height:1.25;margin:.6% 0}.date{font-size:clamp(11px,2vw,33px);font-weight:700;line-height:1.14;margin:.5% 0}.time,.venue{font-size:clamp(10px,1.65vw,27px);font-weight:600;line-height:1.17;margin:.5% 0}.venue{font-size:clamp(10px,1.55vw,25px)}.sub{font-size:clamp(9px,1.1vw,18px);line-height:1.12;max-width:92%;margin:1.5% 0 0}.reception{font-size:clamp(9px,1.2vw,20px);font-weight:700;border-top:1px solid #bf8844;padding-top:1.3%;margin-top:1.3%}.sparkles{position:absolute;inset:0;pointer-events:none;z-index:5}.spark{position:absolute;top:-5%;font-size:clamp(5px,1vw,14px);color:#ffedbd;animation:fall linear infinite;opacity:0}@keyframes fall{10%{opacity:.9}90%{opacity:.8}to{transform:translate(25px,110vh) rotate(250deg);opacity:0}}.ui{position:fixed;bottom:clamp(8px,2vh,28px);left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:18px;background:#350a1fd9;border:1px solid #f0c77c;border-radius:30px;padding:7px 15px;box-shadow:0 8px 25px #0008}.ui button{background:transparent;color:#ffe0a6;border:0;font-size:24px;cursor:pointer;min-width:30px}.ui span{font:11px Cinzel,serif;letter-spacing:.08em;color:#ffe5b9;white-space:nowrap}.music{position:fixed;right:2%;top:2%;z-index:10;border:1px solid #e9c487;border-radius:50%;width:43px;height:43px;color:#ffe5b6;background:#390a20c9;cursor:pointer}.sr{position:absolute;left:-9999px}

</style></head><body><div class="screen"><div class="stage"><div class="backdrop"></div><div class="cover"></div><main class="card" id="card" aria-live="polite"></main><div class="sparkles" id="sparkles"></div></div></div><button class="music" id="music" aria-label="Toggle music">♫</button><nav class="ui" aria-label="Invitation navigation"><button id="prev" aria-label="Previous">‹</button><span id="label">WEDDING INVITATION</span><button id="next" aria-label="Next">›</button></nav><script>
const pages=[

{label:"SANGEET",head:"SANGEET",date:"Thursday, 26th November 2026",time:"7:00 p.m. onwards",venue:"AMRITH GARDEN AMBAGILU, Udupi",sub:"An evening of music, dance and celebration"},
{label:"MEHNDI",head:"MEHNDI",date:"Friday, 27th November 2026",time:"7:00 p.m. onwards",venue:"SHREE KATEEL, Petemane Padubidri, Udupi",sub:"A celebration of colour, love and laughter"},

const card=document.getElementById("card"),label=document.getElementById("label");let index=0,busy=false;function render(){let p=pages[index];label.textContent=p.label;card.innerHTML=`<div class="eyebrow">${p.head}</div><div class="names">Dhanraj &amp; Veditha</div><div class="divider">❧ ✦ ❧</div><div class="date">${p.date}</div><div class="time">${p.time}</div>${p.venue?`<div class="venue">Venue: ${p.venue}</div>`:""}${p.reception?`<div class="reception">${p.reception}</div>`:""}${p.sub?`<div class="sub">${p.sub}</div>`:""}`};function go(d){if(busy)return;busy=true;card.classList.remove("enter");card.classList.add("exit");setTimeout(()=>{index=(index+d+pages.length)%pages.length;render();card.classList.remove("exit");void card.offsetWidth;card.classList.add("enter");setTimeout(()=>{card.classList.remove("enter");busy=false},1400)},800)}document.getElementById("prev").onclick=()=>go(-1);document.getElementById("next").onclick=()=>go(1);document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});let sx=0;document.addEventListener("touchstart",e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener("touchend",e=>{let dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>50)go(dx<0?1:-1)},{passive:true});let sparkles=document.getElementById("sparkles");for(let i=0;i<45;i++){let s=document.createElement("span");s.className="spark";s.textContent=i%2?"✧":"✦";s.style.left=Math.random()*100+"%";s.style.animationDuration=9+Math.random()*13+"s";s.style.animationDelay=-Math.random()*22+"s";sparkles.append(s)}render();
let audio,interval,playing=false,n=0;document.getElementById("music").onclick=async()=>{let btn=document.getElementById("music");if(playing){clearInterval(interval);await audio.suspend();playing=false;btn.textContent="♫";return}audio=audio||new(window.AudioContext||window.webkitAudioContext)();await audio.resume();function play(){let f=[261.63,329.63,392,523.25,493.88,392,329.63,293.66][n++%8],t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.025,t+.2);g.gain.exponentialRampToValueAtTime(.0001,t+2.3);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+2.4)}play();interval=setInterval(play,1750);playing=true;btn.textContent="Ⅱ"};
</script></body></html>
